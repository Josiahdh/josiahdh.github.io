<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-lg-4">
          <h5 class="text-light">Email</h5>
          <p class="text-white font-secondary footer-email">{{ site.data.settings.email }}</p>
        </div>
        <div class="col-lg-4 mt-4 mt-lg-0">
          <h5 class="text-light">Socials</h5>
          <div>
            {% for social in site.data.settings.social %}
            <a class="text-white footer-social-icon" href="{{ social.link }}" target="_blank" rel="noopener noreferrer"><i class="{{ social.icon }}"></i></a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="border-top text-center border-secondary py-5">
    <p class="mb-0 text-white">{{site.data.settings.copyright}}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
